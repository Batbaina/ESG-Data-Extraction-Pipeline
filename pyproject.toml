[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esg-data-extraction-pipeline"
version = "3.0.0"
description = "PDF/Excel/TXT to grounded ESG knowledge units with local Qwen, Pydantic validation, QC and human review."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
pdf = ["docling>=2.0"]
dev = ["pytest>=8,<9"]

[project.scripts]
esg-extract = "esg_pipeline.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
